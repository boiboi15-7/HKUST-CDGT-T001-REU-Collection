<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REU Alien NFT | Mint Page</title>
  <!-- Ethers.js v5 via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(88, 166, 255, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(35, 134, 54, 0.12) 0px, transparent 50%);
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(88, 166, 255, 0.1);
      color: #58a6ff;
      border: 1px solid rgba(88, 166, 255, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #58a6ff;
      border-radius: 50%;
    }

    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 14px; color: #8b949e; margin-bottom: 24px; }

    .stats-container {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8b949e;
      font-weight: 600;
      text-transform: uppercase;
    }

    .counter-value {
      font-size: 18px;
      font-weight: 700;
      color: #58a6ff;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-box {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-box:focus { border-color: #58a6ff; }

    .wallet-chip {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #30363d;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 20px;
      word-break: break-all;
    }

    .btn {
      background: #238636;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
    }

    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #21262d; color: #484f58; box-shadow: none; cursor: not-allowed; }

    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #8b949e;
      line-height: 1.5;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span> Sepolia Testnet
    </div>

    <h1>REU Alien NFT</h1>
    <p class="subtitle">Official Collection Mint Page</p>

    <div class="stats-container">
      <div class="stats-header">
        <span>Total Supply</span>
        <span id="totalSupply" class="counter-value">- / 10</span>
      </div>
    </div>

    <div id="walletDisplay" class="wallet-chip"></div>

    <!-- Step 1: Connect Wallet Button -->
    <button id="connectBtn" class="btn" onclick="connectWallet()">Connect MetaMask</button>

    <!-- Step 2: Pinata CID Box & Mint Button -->
    <div id="mintSection" style="display: none;">
      <div class="input-group">
        <label for="cidInput">Pinata IPFS CID</label>
        <input 
          type="text" 
          id="cidInput" 
          class="input-box" 
          placeholder="Paste CID here (e.g. Qm... or bafy...)"
        />
      </div>

      <button id="mintBtn" class="btn" onclick="mintNFT()">Mint REU NFT</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0x3F624c103e523A475ddb15f4dF616F263F3407e5";
    const SEPOLIA_CHAIN_ID = "0xaa36a7";

    const CONTRACT_ABI = [
      "function requestNFT() public",
      "function requestNFT(string memory tokenURI) public",
      "function totalSupply() public view returns (uint256)"
    ];

    let currentAccount = null;

    async function connectWallet() {
      const status = document.getElementById("statusMsg");

      if (typeof window.ethereum === "undefined") {
        alert("MetaMask extension not detected!");
        return;
      }

      try {
        status.innerText = "Connecting to MetaMask...";
        
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        currentAccount = accounts[0];

        const chainId = await window.ethereum.request({ method: 'eth_chainId' });
        if (chainId !== SEPOLIA_CHAIN_ID) {
          status.innerText = "Switching network to Sepolia...";
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: SEPOLIA_CHAIN_ID }],
          });
        }

        document.getElementById("walletDisplay").innerText = `Connected: ${currentAccount.substring(0,6)}...${currentAccount.substring(currentAccount.length-4)}`;
        document.getElementById("walletDisplay").style.display = "block";
        document.getElementById("connectBtn").style.display = "none";
        document.getElementById("mintSection").style.display = "block";
        status.innerText = "";

        await loadTotalSupply();
      } catch (err) {
        console.error(err);
        status.innerText = "Wallet connection failed or rejected.";
      }
    }

    async function loadTotalSupply() {
      try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);
        const supply = await contract.totalSupply();
        document.getElementById("totalSupply").innerText = `${supply.toString()} / 10`;
      } catch (err) {
        console.error("Error fetching supply:", err);
      }
    }

    async function mintNFT() {
      const cidInput = document.getElementById("cidInput").value.trim();
      const mintBtn = document.getElementById("mintBtn");
      const status = document.getElementById("statusMsg");

      try {
        mintBtn.disabled = true;
        mintBtn.innerText = "Minting...";

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

        let tx;
        if (cidInput) {
          const formattedURI = cidInput.startsWith("ipfs://") ? cidInput : `ipfs://${cidInput}`;
          status.innerText = "Confirm transaction in MetaMask...";
          try {
            tx = await contract["requestNFT(string)"](formattedURI);
          } catch (err) {
            tx = await contract.requestNFT();
          }
        } else {
          status.innerText = "Confirm transaction in MetaMask...";
          tx = await contract.requestNFT();
        }

        status.innerText = `Submitted! Hash: ${tx.hash.substring(0, 10)}... Waiting for confirmation.`;
        await tx.wait();
        status.innerText = "🎉 REU Alien NFT Minted Successfully!";
        
        document.getElementById("cidInput").value = "";
        await loadTotalSupply();
      } catch (err) {
        console.error(err);
        status.innerText = "Transaction failed or canceled.";
      } finally {
        mintBtn.disabled = false;
        mintBtn.innerText = "Mint REU NFT";
      }
    }

    window.addEventListener('load', async () => {
      if (typeof window.ethereum !== 'undefined' && window.ethereum.selectedAddress) {
        currentAccount = window.ethereum.selectedAddress;
        document.getElementById("walletDisplay").innerText = `Connected: ${currentAccount.substring(0,6)}...${currentAccount.substring(currentAccount.length-4)}`;
        document.getElementById("walletDisplay").style.display = "block";
        document.getElementById("connectBtn").style.display = "none";
        document.getElementById("mintSection").style.display = "block";
        await loadTotalSupply();
      }
    });
  </script>
</body>
</html>
