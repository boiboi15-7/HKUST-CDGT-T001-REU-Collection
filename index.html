<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REU Alien NFT Collection</title>
  <!-- Load Ethers.js v5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    h1 { margin-top: 0; font-size: 1.8rem; }
    p { color: #cbd5e1; font-size: 0.95rem; }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 0.9rem;
    }
    button {
      width: 95%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    .status { margin-top: 15px; font-size: 0.85rem; word-break: break-word; }
    .error { color: #f87171; }
    .success { color: #4ade80; }
  </style>
</head>
<body>

  <div class="card">
    <h1>REU Alien NFT Mint</h1>
    <p>Mint your REU Alien NFT directly on Sepolia testnet.</p>
    
    <div>
      <p id="supplyText">Total Minted: --</p>
    </div>

    <button id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>
    <p id="walletAddress" style="font-size: 0.8rem; color: #a855f7;"></p>

    <div id="mintSection" style="margin-top: 20px;">
      <input type="text" id="cidInput" placeholder="Enter IPFS Metadata CID" value="bafybeifrff6yjyf7esz4rsfusasdjbxmckfm3a3ch7qvbm756usovunoze" />
      <button id="mintBtn" onclick="mintNFT()">Mint REU NFT</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0xb8eF45d272D357Ff694dE43E5Fa1c5D763B72d7C";
    const SEPOLIA_CHAIN_ID = "0xaa36a7"; // 11155111 in hex

    // Comprehensive ABI supporting multiple minting method names
    const CONTRACT_ABI = [
      "function requestNFT(string memory tokenURI) public",
      "function requestNFT() public",
      "function mint(string memory tokenURI) public",
      "function mint() public",
      "function totalSupply() public view returns (uint256)"
    ];

    let provider;
    let signer;
    let contract;

    async function connectWallet() {
      const status = document.getElementById("status");
      status.className = "status";
      status.innerText = "Connecting wallet...";

      if (!window.ethereum) {
        status.className = "status error";
        status.innerText = "MetaMask is not installed. Please install it to continue.";
        return;
      }

      try {
        // Request account access
        await window.ethereum.request({ method: "eth_requestAccounts" });

        // Ensure user is on Sepolia network
        const chainId = await window.ethereum.request({ method: "eth_chainId" });
        if (chainId !== SEPOLIA_CHAIN_ID) {
          try {
            await window.ethereum.request({
              method: "wallet_switchEthereumChain",
              params: [{ chainId: SEPOLIA_CHAIN_ID }],
            });
          } catch (switchError) {
            status.className = "status error";
            status.innerText = "Please switch your MetaMask network to Sepolia Testnet.";
            return;
          }
        }

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

        const userAddress = await signer.getAddress();
        document.getElementById("connectBtn").innerText = "Connected";
        document.getElementById("connectBtn").disabled = true;
        document.getElementById("walletAddress").innerText = `Wallet: ${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;

        status.innerText = "";
        await updateSupply();
      } catch (err) {
        console.error(err);
        status.className = "status error";
        status.innerText = err.message || "Failed to connect wallet.";
      }
    }

    async function updateSupply() {
      try {
        if (contract) {
          const supply = await contract.totalSupply();
          document.getElementById("supplyText").innerText = `Total Minted: ${supply.toString()}`;
        }
      } catch (err) {
        console.warn("Could not fetch totalSupply from contract:", err);
      }
    }

    async function mintNFT() {
      const status = document.getElementById("status");
      const mintBtn = document.getElementById("mintBtn");
      status.className = "status";

      if (!signer || !contract) {
        status.className = "status error";
        status.innerText = "Please connect your wallet first.";
        return;
      }

      let cid = document.getElementById("cidInput").value.trim();
      if (!cid) {
        status.className = "status error";
        status.innerText = "Please enter a valid IPFS CID.";
        return;
      }

      // Format CID into full IPFS protocol URI if necessary
      let formattedURI = cid.startsWith("ipfs://") ? cid : `ipfs://${cid}`;

      try {
        mintBtn.disabled = true;
        status.innerText = "Initiating transaction in MetaMask...";

        let tx;
        
        // Attempt 1: Call requestNFT(tokenURI)
        try {
          tx = await contract.requestNFT(formattedURI);
        } catch (e1) {
          console.warn("requestNFT(string) failed, trying requestNFT() without parameters...", e1);
          // Attempt 2: Fallback to requestNFT() without arguments
          try {
            tx = await contract.requestNFT();
          } catch (e2) {
            console.warn("requestNFT() failed, trying mint(string)...", e2);
            // Attempt 3: Fallback to mint(string)
            tx = await contract.mint(formattedURI);
          }
        }

        status.innerText = `Transaction submitted! Waiting for block confirmation...\nHash: ${tx.hash.substring(0, 10)}...`;

        // Wait for mining on Sepolia blockchain
        await tx.wait();

        status.className = "status success";
        status.innerText = "🎉 NFT successfully minted on Sepolia!";
        await updateSupply();

      } catch (err) {
        console.error("Mint error:", err);
        status.className = "status error";
        status.innerText = err.reason || err.message || "Minting transaction failed or was rejected.";
      } finally {
        mintBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
