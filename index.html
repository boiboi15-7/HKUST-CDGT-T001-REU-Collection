<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mint REU Coin</title>
  <!-- Load ethers.js v5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 15px; }
    input, button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; width: 300px; }
    button { background-color: #f6851b; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #e2761b; }
  </style>
</head>
<body>

  <h1>Mint REU Coin</h1>
  
  <button id="connectBtn">Connect MetaMask</button>
  <p id="walletAddress"></p>

  <div>
    <input type="text" id="cidInput" placeholder="Paste Pinata CID here (e.g. Qm...)" />
  </div>
  <button id="mintBtn" disabled>Mint REU Token</button>
  <p id="status"></p>

  <script>
    // 1. UPDATE THESE TWO VALUES
    const CONTRACT_ADDRESS = "0xYOUR_SMART_CONTRACT_ADDRESS_HERE";
    
    // ERC-721 / Token Mint ABI declaration
    const CONTRACT_ABI = [
      "function safeMint(address to, string memory uri) public payable",
      "function mint(string memory uri) public"
    ];

    let provider;
    let signer;
    let contract;

    const connectBtn = document.getElementById('connectBtn');
    const mintBtn = document.getElementById('mintBtn');
    const statusText = document.getElementById('status');
    const walletAddressText = document.getElementById('walletAddress');

    // Connect Wallet
    connectBtn.addEventListener('click', async () => {
      if (typeof window.ethereum !== 'undefined') {
        try {
          provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send("eth_requestAccounts", []);
          signer = provider.getSigner();
          
          const address = await signer.getAddress();
          walletAddressText.innerText = `Connected: ${address.substring(0,6)}...${address.substring(address.length - 4)}`;
          
          contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
          mintBtn.disabled = false;
        } catch (error) {
          statusText.innerText = "Wallet connection failed: " + error.message;
        }
      } else {
        alert("Please install MetaMask!");
      }
    });

    // Mint Token
    mintBtn.addEventListener('click', async () => {
      const cid = document.getElementById('cidInput').value.trim();
      if (!cid) {
        alert("Please paste your Pinata CID.");
        return;
      }

      // Convert CID to standard IPFS protocol URI format
      const tokenURI = cid.startsWith("ipfs://") ? cid : `ipfs://${cid}`;

      try {
        statusText.innerText = "Awaiting transaction confirmation in MetaMask...";
        
        // Calls contract mint function. Change 'safeMint' to match your contract's method name.
        const userAddress = await signer.getAddress();
        const tx = await contract.safeMint(userAddress, tokenURI);
        
        statusText.innerText = `Transaction submitted! Hash: ${tx.hash}. Waiting for block confirmation...`;
        await tx.wait();
        
        statusText.innerText = "Mint successful! Token generated.";
      } catch (error) {
        console.error(error);
        statusText.innerText = "Mint failed: " + (error.reason || error.message);
      }
    });
  </script>
</body>
</html>
